[package]
name = "linkwache-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Platform-independent logic of the Linkwache desktop app (no UI, no Tauri)."

[dependencies]
url = "2.5"
idna = "1"
psl = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
dirs = "5"

[dev-dependencies]
tempfile = "3"
