[package]
name = "linkwache"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Linkwache desktop: every link is checked before it opens"

[lib]
name = "linkwache_app"
path = "src/lib.rs"

[[bin]]
name = "linkwache"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
linkwache-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Time"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"

[features]
# Test hook for the end-to-end tests (writes UI state to $LINKWACHE_E2E_STATE_FILE).
# Never enabled in release builds.
e2e = []
